services:
  web:
    build: ./apps/web
    ports:
      - "5173:80"
    depends_on:
      - bff

  bff:
    build: ./apps/bff
    ports:
      - "3000:3000"
    environment:
      AI_SERVICE_URL: http://ai:8000
    depends_on:
      - brain

  brain:
    build: ./services/brain
    ports:
      - "8000:8000"
    env_file:
      - ./services/brain/.env.example
